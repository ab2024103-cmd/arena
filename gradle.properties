# Morse Code — hardware-aware Gradle settings (see README Section 0)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=true
org.gradle.workers.max=2
# NOTE: org.gradle.configuration-cache is intentionally NOT enabled:
# SQLDelight 2.0.2's Gradle plugin is not yet configuration-cache compatible
# and the reliability trade-off was not worth it on constrained hardware.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
